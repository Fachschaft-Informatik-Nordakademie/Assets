<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%"  stop-color="#15263F"/>
      <stop offset="60%" stop-color="#0E192D"/>
      <stop offset="100%" stop-color="#0A1424"/>
    </radialGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="72" x2="0" y2="558">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#F2F5FB"/>
      <stop offset="100%" stop-color="#BDCBE5"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#050C18" flood-opacity="0.55"/>
    </filter>

    <!-- ===== node geometry: 200x200 rounded square, ring stroke 24 ===== -->
    <path id="node" d="M -100,-50 A 50,50 0 0 1 -50,-100 H 50 A 50,50 0 0 1 100,-50 V 50 A 50,50 0 0 1 50,100 H -50 A 50,50 0 0 1 -100,50 Z"/>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <g transform="translate(320,320) scale(0.9) translate(-320,-320)" filter="url(#shadow)">

    <!-- ============ 1. blue halo + inner panels (drawn first, under everything) ============ -->
    <g fill="#003A79" stroke="#003A79" stroke-width="60" stroke-linejoin="round" stroke-linecap="round">
      <!-- connectors -->
      <path d="M 320,272 V 330 M 196,330 H 444 M 196,330 V 358 M 444,330 V 358" fill="none" stroke-width="58"/>
      <!-- nodes -->
      <use href="#node" x="320" y="172"/>
      <use href="#node" x="196" y="458"/>
      <use href="#node" x="444" y="458"/>
    </g>

    <!-- ============ 2. white structure: connectors + node rings ============ -->
    <g fill="none" stroke="url(#glyph)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 320,272 V 334 M 196,332 H 444 M 196,330 V 358 M 444,330 V 358" stroke-width="24"/>
      <use href="#node" x="320" y="172" stroke-width="24"/>
      <use href="#node" x="196" y="458" stroke-width="24"/>
      <use href="#node" x="444" y="458" stroke-width="24"/>
    </g>
    <!-- junction dot -->
    <circle cx="320" cy="332" r="0" fill="url(#glyph)"/>

    <!-- ============ 3. ICON: Fachschaft chat bubbles (hub node) ============ -->
    <g transform="translate(320,172) scale(1.06)">
      <!-- back bubble, filled -->
      <path d="M 8,6 H 45 a13,13 0 0 1 13,13 V 42 L 60,62 L 32,50 H 7 a13,13 0 0 1 -13,-13 V 19 a13,13 0 0 1 13,-13 Z"
            fill="url(#glyph)"/>
      <!-- front bubble: blue knockout -->
      <path d="M -44,-58 H 2 a14,14 0 0 1 14,14 V -18 a14,14 0 0 1 -14,14 H -18 L -20,22 L -46,-4 a14,14 0 0 1 -12,-14 V -44 a14,14 0 0 1 14,-14 Z"
            fill="#003A79" stroke="#003A79" stroke-width="32" stroke-linejoin="round"/>
      <!-- front bubble: white outline -->
      <path d="M -44,-58 H 2 a14,14 0 0 1 14,14 V -18 a14,14 0 0 1 -14,14 H -18 L -20,22 L -46,-4 a14,14 0 0 1 -12,-14 V -44 a14,14 0 0 1 14,-14 Z"
            fill="none" stroke="url(#glyph)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- ============ 4. ICON: Marketing megaphone (left node) ============ -->
    <g transform="translate(196,458) scale(1.04)" fill="url(#glyph)" stroke="url(#glyph)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -54,-17 L -8,-49 V 49 L -54,17 Z" stroke-width="11"/>
      <path d="M -36,14 h 22 v 32 a 11,11 0 0 1 -22,0 Z" stroke-width="8"/>
      <g fill="none" stroke-width="13">
        <path d="M 12,-29 L 35,-44"/>
        <path d="M 16,0 H 43"/>
        <path d="M 12,29 L 35,44"/>
      </g>
    </g>

    <!-- ============ 5. ICON: Brettspieltreff die (right node) ============ -->
    <g transform="translate(444,458) rotate(-14)">
      <rect x="-50" y="-50" width="100" height="100" rx="22" fill="url(#glyph)"/>
      <g fill="#003A79">
        <circle cx="-26" cy="-26" r="9.5"/>
        <circle cx="26"  cy="-26" r="9.5"/>
        <circle cx="0"   cy="0"   r="9.5"/>
        <circle cx="-26" cy="26"  r="9.5"/>
        <circle cx="26"  cy="26"  r="9.5"/>
      </g>
    </g>
  </g>
</svg>
